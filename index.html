<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Jevens">
  <meta name="google-site-verification" content="8S98l5Ha2yMpUDLNNGaU5T8Y5O3pZBwyN-4nKmfZ1dc" />
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="/images/penguin_icon_32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/images/penguin_icon_16x16.png" sizes="16x16">
  <title>RREF Calculator</title>
</head>
<body>
  <!-- Top Visual Row (Images Only) -->
  <div class="top-row">
    <img src="images/penguin.png" alt="Penguin graphic" class="penguin">
    <img src="images/matrix.png" alt="Matrix graphic" class="matrix">
  </div>

  <!-- Header (Text Only) -->
  <header class="page-header">
    <h1 class="main-heading">Matrix Row Reducer</h1>
    <p class="subheading">Compute row-echelon (REF) and reduced row-echelon forms (RREF) of a matrix!</p>
  </header>

  <!-- Main Content -->
  <main class="content">

    <!-- Solver Section -->
    <section class="solver">
      <h2 class="solver-title">Step 1: Define Matrix Bounds</h2>

      <form class="solver-form">
        <label>
          <span>Rows:</span>
          <input type="number" id="rowInput" name="rows" value="3" min="1" max="5">
        </label>
	<p style="font-size: 25px;">×    </p>
        <label>
          <span>Columns:</span>
          <input type="number" id="columnInput" name="columns" value="3" min="1" max="5">
        </label>

        <button type="button" onclick="resizeMatrix()">Generate</button>
      </form>
      <div id="input-grid">
      </div>
      <span id="button-span">
        <h3 class="solver-title">Step 2: Apply Gaussian Elimination</h2>
        <button type="button" class="buttons" onclick="compute()">Compute</button>
        <button type="button" class="buttons" onclick="clearAll()">Clear All</button>
      </span>
    </section>
    <!-- Computation -->
    <section id="computation" class="is-hidden">
      <div class="hbox-container">
        <p style="font-size: 24px;">Row-Echelon Form: </p>
        <p id="ref-matrix">
	  [0 0 0]<br>
	  [0 0 0]<br>
	  [0 0 0]	  
        </p>

        <p style="font-size: 24px;">Reduced Row-Echelon Form: </p>
        <p id="rref-matrix">
	  [1 0 0]<br>
	  [0 1 0]<br>
	  [0 0 1]
	</p>
      </div>
    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
